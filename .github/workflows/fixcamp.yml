name: Fix campaigns
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Make the changes (yes/no)"
        default: "no"
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
        run: python fix_campaigns.py apply=${{ github.event.inputs.apply }}
