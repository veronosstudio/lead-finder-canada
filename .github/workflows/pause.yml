name: Pause or resume Veronos campaigns
on:
  workflow_dispatch:
    inputs:
      action:
        description: "pause or resume"
        default: "pause"
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
        run: python pause_campaigns.py ${{ github.event.inputs.action }}
