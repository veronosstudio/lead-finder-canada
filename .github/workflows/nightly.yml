name: Nightly lead finder (Canada)

on:
  schedule:
    - cron: "17 8 * * *"   # about 1:17 AM Edmonton (MST) every day
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: finder
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Find leads
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
        run: python finder.py
      - name: Save results
        if: always()
        run: |
          git config user.name "veronos-finder"
          git config user.email "finder@users.noreply.github.com"
          git add leads data state
          git diff --cached --quiet || git commit -m "Leads $(date -u +%F)"
          git pull --rebase -q || true
          git push
