name: Audit test (search + top-up dry run, writes nothing)
on: workflow_dispatch
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests duckdb
      - name: Get Reacher CLI (MIT)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo reacherhq/check-if-email-exists --pattern '*x86_64-unknown-linux-gnu.tar.gz' --dir reacher
          tar xzf reacher/*.tar.gz -C reacher
          B=$(find reacher -type f -name 'check_if_email_exists' | head -1); chmod +x "$B"; echo "REACHER_BIN=$PWD/$B" >> $GITHUB_ENV
      - name: Search one US slice (no sheet secrets, so nothing is saved)
        env:
          CONFIG: config_us.json
          SHARD: "7"
          SHARDS: "20"
        run: |
          python overture_source.py target=40 metros=auto | grep -E "LEAD|DONE|overture:" | tail -60
          python - <<'PY'
          import csv, glob, re
          from collections import Counter
          c = Counter()
          for f in glob.glob("data/seen-overture-s7.csv"):
              for row in csv.reader(open(f)):
                  if len(row) >= 4 and row[2] == __import__("datetime").date.today().isoformat():
                      c[re.sub(r"\(.*", "", row[3]).split(":")[0]] += 1
          print("TODAY'S RESULTS:", dict(c.most_common()))
          PY
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Get Reacher CLI (MIT)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo reacherhq/check-if-email-exists --pattern '*x86_64-unknown-linux-gnu.tar.gz' --dir reacher
          tar xzf reacher/*.tar.gz -C reacher
          B=$(find reacher -type f -name 'check_if_email_exists' | head -1); chmod +x "$B"; echo "REACHER_BIN=$PWD/$B" >> $GITHUB_ENV
      - name: Top-up dry run (push=no, mark=no)
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
        run: |
          python export_instantly.py country=CA tiers=A,B limit=400 push=no mark=no verify=yes generals=fill out=t.csv
          python - <<'PY'
          import csv
          from collections import Counter
          rows = list(csv.DictReader(open("t.csv")))
          print("ROWS", len(rows), "types", dict(Counter(r["emailType"] for r in rows)))
          for r in rows[:12]: print(" ", r["emailType"], "|", r["companyName"], "|", r["subjA"], "|", r["coPoss"])
          PY
