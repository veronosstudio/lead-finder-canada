name: Nightly lead finder (US, state by state)

on:
  schedule:
    - cron: "23 9 * * *"   # about 2:23 AM Edmonton, after the Canada run
  workflow_dispatch:
    inputs:
      test_leads:
        description: "Quick test: stop after this many leads (leave empty for a full run)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: finder
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Find leads
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          TEST_LEADS: ${{ github.event.inputs.test_leads }}
          CONFIG: config_us.json
        run: python finder.py
      - name: Save results
        if: always()
        run: |
          git config user.name "veronos-finder"
          git config user.email "finder@users.noreply.github.com"
          git add leads data state
          git diff --cached --quiet || git commit -m "US leads $(date -u +%F)"
          git pull --rebase -q || true
          git push
