name: Upgrade existing contacts (score + competitors)

on:
  workflow_dispatch:
    inputs:
      redo:
        description: "Re-check and re-match every contact (yes/no)"
        required: false
        default: "no"
      gate:
        description: "Skip not-clearly-dated contacts + re-tag new niches (yes/no)"
        required: false
        default: "no"
      fixsheet:
        description: "Fill hooks/since + one contact per business (yes/no)"
        required: false
        default: "no"
      prune:
        description: "Clean-up: 'dry' = report only, 'apply' = delete (needs Kash's OK)"
        required: false
        default: "no"
      unskip:
        description: "Bring back skipped contacts under the points rule: 'dry' or 'apply'"
        required: false
        default: ""
      inspect:
        description: "Read-only: names to look up (regex), e.g. desert shores|glover"
        required: false
        default: ""
      retier:
        description: "Only re-label yay/nay from stored scores (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: finder
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Inspect (read-only)
        if: github.event.inputs.inspect != ''
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
        run: python inspect_rows.py "${{ github.event.inputs.inspect }}"
      - name: Upgrade contacts
        if: github.event.inputs.inspect == ''
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
        run: python refine_existing.py ${{ github.event.inputs.redo == 'yes' && 'redo' || '' }} ${{ github.event.inputs.retier == 'yes' && 'retier' || '' }} ${{ github.event.inputs.fixsheet == 'yes' && 'fixsheet' || '' }} ${{ github.event.inputs.gate == 'yes' && 'gate' || '' }} ${{ github.event.inputs.prune == 'dry' && 'prune' || '' }} ${{ github.event.inputs.prune == 'apply' && 'prune_apply' || '' }} ${{ github.event.inputs.unskip == 'dry' && 'unskip' || '' }} ${{ github.event.inputs.unskip == 'apply' && 'unskip_apply' || '' }}
      - name: Save competitor pool
        if: always()
        run: |
          git config user.name "veronos-finder"
          git config user.email "finder@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Competitor pool $(date -u +%F)"
          git pull --rebase -q || true
          git push
