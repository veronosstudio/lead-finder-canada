name: Upgrade existing contacts (score + competitors)

on:
  workflow_dispatch:
    inputs:
      redo:
        description: "Re-check and re-match every contact (yes/no)"
        required: false
        default: "no"
      gate:
        description: "Skip not-clearly-dated contacts + re-tag new niches (yes/no)"
        required: false
        default: "no"
      fixsheet:
        description: "Fill hooks/since + one contact per business (yes/no)"
        required: false
        default: "no"
      retier:
        description: "Only re-label yay/nay from stored scores (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: finder
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Upgrade contacts
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
        run: python refine_existing.py ${{ github.event.inputs.redo == 'yes' && 'redo' || '' }} ${{ github.event.inputs.retier == 'yes' && 'retier' || '' }} ${{ github.event.inputs.fixsheet == 'yes' && 'fixsheet' || '' }} ${{ github.event.inputs.gate == 'yes' && 'gate' || '' }}
      - name: Save competitor pool
        if: always()
        run: |
          git config user.name "veronos-finder"
          git config user.email "finder@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Competitor pool $(date -u +%F)"
          git pull --rebase -q || true
          git push
