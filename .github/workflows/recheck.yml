name: Recheck emails

# Re-reads every shared-inbox lead looking for the owner's email (Kash, Nov 24).
# apply=no: report only (recheck.csv artifacts). apply=yes: swap better emails in Instantly for leads not emailed yet.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Swap in Instantly (yes/no)"
        default: "no"

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests duckdb
      - name: Recheck
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          SHARD: ${{ matrix.shard }}
          SHARDS: "8"
        run: python recheck_emails.py apply=${{ github.event.inputs.apply }}
      - uses: actions/upload-artifact@v4
        with:
          name: recheck-${{ matrix.shard }}
          path: recheck.csv
          retention-days: 7
