name: Suppress an address (never contact again)
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email to blocklist"
        required: true
jobs:
  suppress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          EMAIL: ${{ github.event.inputs.email }}
        run: python suppress.py "email=$EMAIL"
